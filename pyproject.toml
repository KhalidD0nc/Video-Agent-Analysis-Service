[project]
name = "coachai"
version = "0.1.0"
description = "CoachAI video analysis pipeline"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "SIM108", "E402", "RUF002", "RUF005", "RUF015", "SIM105", "SIM113"]

[tool.ruff.lint.isort]
known-first-party = ["coachai"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
