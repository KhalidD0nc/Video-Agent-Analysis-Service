name: CI

on:
  pull_request:
    branches: [main, development, staging]
  push:
    branches: [main, development, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install offline test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Verify configuration import
        run: python -c "from coachai.config import MODELS_TO_RUN; print('OK:', MODELS_TO_RUN)"
      - name: Run existing smoke tests
        run: python -m pytest tests/ -v

  production-path-guard:
    name: Production Path Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identify production path changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD -- modal_app.py src/coachai/pipeline.py src/coachai/inference/engine.py)
          if [ -n "$CHANGED" ]; then
            echo "::warning::Production-critical paths changed; extra inference/deployment review is needed."
            {
              echo "## Production path review"
              echo "$CHANGED" | sed 's/^/- /'
              echo "Verify these paths with the intended model and deployment environment."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
